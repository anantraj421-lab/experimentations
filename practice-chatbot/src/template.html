<title>Adaptive EV Drill</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA;
  --ink:#141A21; --ink-2:#3D4753; --muted:#69737F;
  --line:#D6DCE4; --line-strong:#B9C2CD;
  --hv:#EA5B16; --hv-soft:#FDEDE3;
  --ok:#17825A; --ok-soft:#E3F3EC;
  --bad:#C2334A; --bad-soft:#FBE7EA;
  --rung-off:#CFD6DF;
  --shadow:0 1px 2px rgba(20,26,33,.06), 0 8px 24px -16px rgba(20,26,33,.35);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --surface:#161C24; --surface-2:#1C232C;
    --ink:#E6EBF1; --ink-2:#BCC6D2; --muted:#8A95A2;
    --line:#28313B; --line-strong:#3A454F;
    --hv:#FF7A3D; --hv-soft:#33190D;
    --ok:#4FC395; --ok-soft:#10281F;
    --bad:#F0788A; --bad-soft:#2C1319;
    --rung-off:#2B343E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#161C24; --surface-2:#1C232C;
  --ink:#E6EBF1; --ink-2:#BCC6D2; --muted:#8A95A2;
  --line:#28313B; --line-strong:#3A454F;
  --hv:#FF7A3D; --hv-soft:#33190D;
  --ok:#4FC395; --ok-soft:#10281F;
  --bad:#F0788A; --bad-soft:#2C1319;
  --rung-off:#2B343E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:780px;margin:0 auto;padding-inline:20px;padding-block:0 56px}

/* ---- instrument strip ---- */
.strip{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.strip-in{max-width:780px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.counter{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.counter b{font-size:19px;font-weight:600}
.counter span{color:var(--muted)}
.ladder{display:flex;align-items:flex-end;gap:3px;height:26px}
.rung{width:14px;background:var(--rung-off);border-radius:2px;transition:background .35s ease,transform .35s ease}
.rung:nth-child(1){height:34%} .rung:nth-child(2){height:50%} .rung:nth-child(3){height:66%}
.rung:nth-child(4){height:83%} .rung:nth-child(5){height:100%}
.rung.on{background:var(--hv)}
.rung.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--hv)}
.ladder-label{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rung-off);transition:background .25s}
.dot.lit{background:var(--ok)}
.strip-grp{display:flex;align-items:center;gap:9px}
.spacer{flex:1 1 auto;min-width:0}
.bar{height:3px;background:var(--rung-off);border-radius:2px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--hv);width:0;transition:width .4s ease}

/* ---- generic ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chip{
  display:inline-flex;align-items:center;gap:7px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:100px;padding:4px 11px;background:var(--surface-2);
}
.chip .tick{width:6px;height:6px;border-radius:50%;background:var(--hv);flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  border:1px solid var(--hv);background:var(--hv);color:#fff;border-radius:8px;
  padding:11px 22px;font-weight:600;font-size:15px;transition:filter .15s,transform .05s;
}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--hv);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- start screen ---- */
.hero{padding-block:44px 8px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--hv);margin-bottom:12px}
.hero h1{font-size:clamp(30px,6vw,44px);line-height:1.05}
.hero p.lede{color:var(--ink-2);font-size:17px;max-width:60ch;margin:14px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:26px}
.rulebox{padding:18px 20px}
.rulebox h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-weight:600;margin-bottom:10px}
.rulebox ol,.rulebox ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14.5px}
.rulebox li{margin-bottom:6px}
.rulebox li:last-child{margin-bottom:0}
.levels{list-style:none;padding:0;margin:0}
.levels li{display:flex;gap:10px;align-items:baseline;margin-bottom:7px;font-size:14.5px;color:var(--ink-2)}
.levels .lv{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--hv);border:1px solid var(--hv);border-radius:4px;padding:0 5px;flex:none}
.srcwrap{margin-top:14px;padding:18px 20px}
.srclist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.srctag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:3px 8px}
.startrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}
.note{font-size:13px;color:var(--muted);max-width:56ch}

/* ---- question ---- */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 14px}
.qstem{font-family:Archivo,sans-serif;font-weight:600;font-size:clamp(19px,3.4vw,24px);line-height:1.34;margin:0 0 20px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;transition:border-color .12s,background .12s;font-size:15.5px;line-height:1.45;
}
.opt:hover:not([disabled]){border-color:var(--line-strong);background:var(--surface-2)}
.opt .key{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--muted);
  border:1px solid var(--line-strong);border-radius:5px;width:22px;height:22px;
  display:grid;place-items:center;flex:none;margin-top:1px;
}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{border-color:var(--ok);color:var(--ok)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .key{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.5}
.fb{margin-top:16px;border-left:3px solid var(--line-strong);padding:12px 0 12px 15px}
.fb.good{border-left-color:var(--ok)} .fb.bad{border-left-color:var(--bad)}
.fb .verdict{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.fb.good .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb p{margin:5px 0 0;color:var(--ink-2);font-size:15px}
.fb .shift{margin-top:9px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--hv)}
.nextrow{display:flex;justify-content:flex-end;margin-top:20px}
.loading{padding:34px 0;color:var(--muted);display:flex;gap:11px;align-items:center;font-size:15px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--hv);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.err{border-left:3px solid var(--bad);padding:12px 15px;background:var(--bad-soft);border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);margin-top:18px}

/* ---- summary ---- */
.sumhead{padding-block:34px 4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:22px}
.kpi{padding:15px 17px}
.kpi .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:Archivo,sans-serif;font-weight:700;font-size:28px;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.sec{margin-top:34px}
.sec h2{font-size:15px;font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.trow{display:grid;grid-template-columns:1fr 92px 46px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.tname{font-size:15px}
.tname i{display:block;font-style:normal;font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.meter{height:7px;background:var(--rung-off);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.tscore{font-family:"IBM Plex Mono",monospace;font-size:13.5px;text-align:right;color:var(--ink-2)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;margin-left:8px;vertical-align:middle}
.tag.s{background:var(--ok-soft);color:var(--ok)} .tag.w{background:var(--bad-soft);color:var(--bad)}
.lvtable{width:100%;border-collapse:collapse;font-size:14.5px}
.lvtable th,.lvtable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.lvtable th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lvtable td.n{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.plan{counter-reset:p;list-style:none;padding:0;margin:0}
.plan li{position:relative;padding-left:34px;margin-bottom:12px;color:var(--ink-2);font-size:15px}
.plan li::before{
  counter-increment:p;content:counter(p);position:absolute;left:0;top:1px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--hv);
  border:1px solid var(--hv);border-radius:5px;width:22px;height:22px;display:grid;place-items:center;
}
.plan b{color:var(--ink)}
.hist{font-size:14px;color:var(--ink-2)}
.hist .hrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:13px}
.hist .hrow:last-child{border-bottom:none}
.endrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
@media (max-width:460px){
  .trow{grid-template-columns:1fr 60px 44px}
  .strip-in{gap:11px;padding:9px 16px}
  .wrap{padding-inline:16px}
}
</style>

<div class="strip" id="strip" hidden>
  <div class="strip-in">
    <div class="counter"><b id="qnum">01</b> <span>/ 21</span></div>
    <div class="strip-grp">
      <div class="ladder" id="ladder" title="Difficulty level"></div>
      <div>
        <div class="ladder-label" id="lvlabel">L2 Compare</div>
        <div class="dots" id="dots" style="margin-top:3px"></div>
      </div>
    </div>
    <div class="spacer"><div class="bar"><i id="prog"></i></div></div>
    <button class="btn ghost" id="quit" style="padding:6px 13px;font-size:13px">End round</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
const SECTIONS = /*__CHUNKS__*/;
const SEED = /*__SEED__*/;

const TOTAL = 21;
const LEVELS = [
  {n:1, name:"Recall",   desc:"a single stated fact, definition, full form or figure taken straight from the source"},
  {n:2, name:"Compare",  desc:"distinguish two concepts, or pick the characteristic that separates one option from its neighbours"},
  {n:3, name:"Apply",    desc:"apply a stated rule, ratio or rule of thumb to a short concrete scenario"},
  {n:4, name:"Analyse",  desc:"a two or three step calculation, or diagnose a likely root cause from described symptoms"},
  {n:5, name:"Judge",    desc:"a design-review trade-off across subsystems or a compliance call under stated constraints, where more than one option is defensible but one is best supported by the source"}
];
const LS = "ev-drill-history-v1";

let sample = null, samplePromise = null;
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- adaptive engine ---------------- */
function newRound(){
  const order = shuffle(SECTIONS.map(s=>s.id));
  const topics = [];
  while(topics.length < TOTAL) topics.push(...shuffle(order.slice()));
  return {
    i:0, level:2, streak:0, probation:0, consecWrong:0,
    peak:2, topics:topics.slice(0,TOTAL), log:[], asked:[],
    started:Date.now(), prefetch:null, q:null, answered:null, err:null, loading:false
  };
}
// 3 correct in a row promotes. A promotion opens a 3-question probation window:
// a miss inside it reverts one level. Outside it, two misses in a row demote.
function applyResult(R, correct){
  const before = R.level;
  let shift = null;
  if(correct){
    R.consecWrong = 0; R.streak++;
    if(R.probation > 0) R.probation--;
    if(R.streak >= 3 && R.level < 5){
      R.level++; R.streak = 0; R.probation = 3;
      shift = "promoted";
    } else if(R.streak >= 3){ R.streak = 0; }
  } else {
    R.streak = 0; R.consecWrong++;
    if(R.probation > 0){
      if(R.level > 1) R.level--;
      R.probation = 0; R.consecWrong = 0; shift = "reverted";
    } else if(R.consecWrong >= 2){
      if(R.level > 1){ R.level--; shift = "eased"; }
      R.consecWrong = 0;
    }
  }
  R.peak = Math.max(R.peak, R.level);
  return {shift, before, after:R.level};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------------- question supply ---------------- */
function sectionById(id){ return SECTIONS.find(s=>s.id===id); }

function buildPrompt(sec, level, avoid){
  const L = LEVELS[level-1];
  return [
    "You are setting one multiple-choice practice question for an electric-vehicle engineering learner.",
    "",
    "SOURCE — the only permitted source of truth:",
    "<<<", sec.text, ">>>",
    "",
    "Rules:",
    "- The question and its correct answer must be verifiable from the SOURCE alone. Use no outside knowledge and invent no numbers.",
    "- Difficulty level " + level + " of 5 (" + L.name + "): " + L.desc + ".",
    "- Exactly four options. One unambiguously correct. Three distractors that a learner with a partial grasp would plausibly pick — never absurd, never joke answers.",
    "- Keep the stem under 45 words. Keep each option under 18 words and of roughly similar length.",
    "- Do not set a question whose stem repeats any of these: " + (avoid.length ? avoid.map(a=>'"'+a+'"').join("; ") : "(none yet)"),
    "- \"concept\" names the specific idea tested, 2 to 4 words.",
    "- \"why\" is one sentence under 30 words explaining the correct answer and citing the subsection number, e.g. \"(3.7)\".",
    "",
    'Reply with only this JSON: {"stem":"...","options":["...","...","...","..."],"answer":0,"why":"...","concept":"..."}'
  ].join("\n");
}
function validQ(q){
  return q && typeof q.stem === "string" && q.stem.trim().length > 8
    && Array.isArray(q.options) && q.options.length === 4
    && q.options.every(o => typeof o === "string" && o.trim().length > 0)
    && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4;
}
function randomiseOptions(q){
  const idx = shuffle([0,1,2,3]);
  const opts = idx.map(i => q.options[i]);
  return Object.assign({}, q, {options:opts, answer:idx.indexOf(q.answer)});
}
async function generate(topicId, level, avoid){
  const sec = sectionById(topicId);
  if(!sample) return seedQuestion(topicId, level, avoid);
  const raw = await sample.json(buildPrompt(sec, level, avoid), {
    modelTier: level <= 2 ? "quick" : "default",
    cache: false
  });
  if(!validQ(raw)) throw {code:"invalid_json", message:"malformed question"};
  return randomiseOptions({
    stem:String(raw.stem).trim(),
    options:raw.options.map(o=>String(o).trim()),
    answer:raw.answer,
    why:String(raw.why || "").trim(),
    concept:String(raw.concept || sec.title).trim(),
    topic:topicId, level, source:"claude"
  });
}
function seedQuestion(topicId, level, avoid){
  const used = (R ? R.asked.map(a => a.stem) : []).concat(avoid);
  let pool = SEED.filter(q => !used.includes(q.stem));
  if(!pool.length) pool = SEED.slice();   // bank exhausted: allow repeats rather than stall
  const exact = pool.filter(q => q.topic === topicId && q.level === level);
  const sameTopic = pool.filter(q => q.topic === topicId);
  const sameLevel = pool.filter(q => Math.abs(q.level - level) <= 1);
  const pick = (exact[0] && shuffle(exact.slice())[0])
    || (sameTopic[0] && shuffle(sameTopic.slice())[0])
    || (sameLevel[0] && shuffle(sameLevel.slice())[0])
    || shuffle(pool.slice())[0];
  return randomiseOptions(Object.assign({}, pick, {source:"bank"}));
}
function avoidList(R, topicId){
  return R.asked.filter(a => a.topic === topicId).slice(-6).map(a => a.stem);
}
function startPrefetch(R){
  const nextIdx = R.i + 1;
  if(nextIdx >= TOTAL) return;
  const topic = R.topics[nextIdx], level = R.level;
  const p = generate(topic, level, avoidList(R, topic)).catch(() => null);
  R.prefetch = {topic, level, promise:p};
}

/* ---------------- render ---------------- */
let R = null;

function renderStart(){
  $("#strip").hidden = true;
  const hist = loadHistory();
  const best = hist.length ? Math.max(...hist.map(h=>h.correct)) : null;
  app.innerHTML = `
  <div class="hero">
    <div class="eyebrow">Adaptive practice · 21 questions</div>
    <h1>EV Engineering Drill</h1>
    <p class="lede">Twenty-one multiple-choice questions written live from your master content. Answer three in a row correctly and the next question steps up a level. Miss one and it steps back down. You cannot return to a question once answered.</p>
  </div>

  <div class="grid2">
    <div class="card rulebox">
      <h3>Difficulty ladder</h3>
      <ul class="levels">
        ${LEVELS.map(l=>`<li><span class="lv">L${l.n}</span><span><b style="font-weight:600">${l.name}</b> — ${esc(l.desc.split(",")[0])}</span></li>`).join("")}
      </ul>
    </div>
    <div class="card rulebox">
      <h3>How it adapts</h3>
      <ol>
        <li>You start at <b>L2</b>.</li>
        <li>Three correct in a row promotes you one level.</li>
        <li>A promotion opens a three-question probation. A miss inside it reverts you one level.</li>
        <li>Outside probation, two misses in a row ease you back one level.</li>
        <li>L1 is the floor, L5 the ceiling.</li>
      </ol>
    </div>
  </div>

  <div class="card srcwrap">
    <h3 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-weight:600;margin-bottom:4px">Master content in scope</h3>
    <div class="note">EV Engineering Handbook: From First Principles to Shop-Floor Practice — ${SECTIONS.length} sections. Every question and its marked answer is drawn from one section only; nothing outside this text is used.</div>
    <div class="srclist">${SECTIONS.map(s=>`<span class="srctag">${s.n}. ${esc(s.title.split(":")[0])}</span>`).join("")}</div>
  </div>

  <div class="startrow">
    <button class="btn" id="go">Start round</button>
    ${hist.length ? `<span class="note">${hist.length} previous round${hist.length>1?"s":""} · best ${best}/21</span>` : ``}
  </div>
  <p class="note" id="engnote" style="margin-top:14px">Checking question engine…</p>
  ${hist.length ? `<div class="sec"><h2>Previous rounds</h2><div class="hist">${hist.slice().reverse().slice(0,8).map(h=>`
    <div class="hrow"><span>${new Date(h.at).toLocaleDateString(undefined,{day:"2-digit",month:"short"})} ${new Date(h.at).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}</span><span>${h.correct}/21 · peak L${h.peak}</span></div>`).join("")}</div></div>` : ``}
  <footer>Questions are generated at the moment you reach them, so no two rounds are the same. Retake as often as you like.</footer>`;

  $("#go").onclick = beginRound;
  ensureSample().then(s => {
    const n = $("#engnote");
    if(!n) return;
    n.textContent = s
      ? "Question engine ready. The first question takes a few seconds to write."
      : "Live generation is unavailable in this view, so the round runs from the built-in question bank instead.";
  });
}

function ensureSample(){
  if(samplePromise) return samplePromise;
  samplePromise = (window.claude && window.claude.use ? window.claude.use("sample") : Promise.resolve(null))
    .then(s => { sample = s; return s; })
    .catch(() => { sample = null; return null; });
  return samplePromise;
}

function beginRound(){
  R = newRound();
  $("#strip").hidden = false;
  nextQuestion(true);
}

async function nextQuestion(first){
  R.answered = null; R.err = null;
  const topic = R.topics[R.i];
  let q = null;

  if(R.prefetch && R.prefetch.topic === topic && R.prefetch.level === R.level){
    const pending = R.prefetch.promise; R.prefetch = null;
    R.loading = true; paint();
    q = await pending;
  }
  if(!q){
    R.loading = true; paint();
    try{
      q = await generate(topic, R.level, avoidList(R, topic));
    }catch(e){
      R.err = errCopy(e);
      if(e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared" || e.code === "capability_disabled")) sample = null;
      q = seedQuestion(topic, R.level, avoidList(R, topic));
    }
  }
  R.loading = false;
  q.level = R.level;            // a bank substitute is answered at the level asked for
  R.q = q;
  R.asked.push({topic, stem:q.stem});
  paint();
  startPrefetch(R);
}

function errCopy(e){
  const c = e && e.code;
  if(c === "not_granted" || c === "sampling_disabled") return "This view is not allowed to write new questions, so the round continues from the built-in bank.";
  if(c === "rate_limited") return "The question engine is busy. Pulling this one from the built-in bank.";
  if(c === "invalid_json" || c === "empty_completion") return "That question came back malformed. Substituted one from the built-in bank.";
  if(c === "session_expired") return "Your session expired. Sign in again to resume live questions.";
  return "The question engine did not respond. Substituted one from the built-in bank.";
}

function paintStrip(){
  $("#qnum").textContent = String(Math.min(R.i + 1, TOTAL)).padStart(2, "0");
  const L = LEVELS[R.level - 1];
  $("#lvlabel").textContent = "L" + R.level + " " + L.name;
  $("#ladder").innerHTML = LEVELS.map(l =>
    `<div class="rung ${l.n <= R.level ? "on" : ""} ${l.n === R.level ? "cur" : ""}"></div>`).join("");
  $("#dots").innerHTML = [0,1,2].map(i => `<span class="dot ${i < R.streak ? "lit" : ""}"></span>`).join("");
  $("#dots").title = R.streak + " correct in a row · 3 promotes";
  $("#prog").style.width = ((R.i + (R.answered ? 1 : 0)) / TOTAL * 100) + "%";
}

function paint(){
  paintStrip();
  if(R.loading){
    app.innerHTML = `<div class="qhead"><span class="chip"><span class="tick"></span>${esc(sectionById(R.topics[R.i]).title)}</span></div>
      <div class="loading"><span class="pulse"></span>Writing a level ${R.level} question from section ${sectionById(R.topics[R.i]).n}…</div>`;
    return;
  }
  const q = R.q, sec = sectionById(q.topic || R.topics[R.i]);
  const a = R.answered;
  app.innerHTML = `
    <div class="qhead">
      <span class="chip"><span class="tick"></span>${esc(sec.title)}</span>
      <span class="chip" style="border-style:dashed">L${q.level || R.level} ${esc(LEVELS[(q.level || R.level) - 1].name)}</span>
    </div>
    <h2 class="qstem">${esc(q.stem)}</h2>
    <div class="opts" id="opts">
      ${q.options.map((o,i)=>{
        let cls = "opt";
        if(a){
          if(i === q.answer) cls += " correct";
          else if(i === a.choice) cls += " chosen-wrong";
          else cls += " dim";
        }
        return `<button class="${cls}" data-i="${i}" ${a ? "disabled" : ""}>
          <span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;
      }).join("")}
    </div>
    ${R.err ? `<div class="err">${esc(R.err)}</div>` : ``}
    ${a ? `
      <div class="fb ${a.correct ? "good" : "bad"}">
        <div class="verdict">${a.correct ? "Correct" : "Not quite"}</div>
        <p>${esc(q.why || "")}</p>
        ${a.shift ? `<div class="shift">${shiftCopy(a)}</div>` : ``}
      </div>
      <div class="nextrow"><button class="btn" id="next">${R.i + 1 >= TOTAL ? "See results" : "Next question"} →</button></div>` : ``}
    ${!a ? `<p class="note" style="margin-top:18px">Press A–D or 1–4. Answers are final — you cannot come back to this question.</p>` : ``}`;

  if(!a){
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  } else {
    const nb = $("#next");
    nb.onclick = advance;
    nb.focus();
  }
}
function shiftCopy(a){
  if(a.shift === "promoted") return "▲ Three in a row — stepping up to L" + a.after + " " + LEVELS[a.after-1].name + ", on probation for three questions.";
  if(a.shift === "reverted") return "▼ Missed inside the probation window — back to L" + a.after + " " + LEVELS[a.after-1].name + ".";
  if(a.shift === "eased")    return "▼ Second miss in a row — easing to L" + a.after + " " + LEVELS[a.after-1].name + ".";
  return "";
}

function answer(choice){
  if(R.answered) return;
  const q = R.q;
  const correct = choice === q.answer;
  const levelAtAsk = R.level;
  const res = applyResult(R, correct);
  R.answered = {choice, correct, shift:res.shift, before:res.before, after:res.after};
  R.log.push({
    topic:q.topic || R.topics[R.i], concept:q.concept || "", level:levelAtAsk,
    correct, stem:q.stem, source:q.source
  });
  paint();
  // The next question's level is now known, so warm it up while the learner reads.
  if(R.prefetch && R.prefetch.level !== R.level) R.prefetch = null;
  if(!R.prefetch) startPrefetch(R);
}

function advance(){
  R.i++;
  if(R.i >= TOTAL){ finish(); return; }
  nextQuestion();
}

/* ---------------- summary ---------------- */
function finish(){
  $("#strip").hidden = true;
  const log = R.log;
  const correct = log.filter(l => l.correct).length;
  const mins = Math.max(1, Math.round((Date.now() - R.started) / 60000));

  const byTopic = {};
  log.forEach(l => {
    const t = byTopic[l.topic] || (byTopic[l.topic] = {n:0, c:0, lv:0, missed:[]});
    t.n++; t.lv += l.level;
    if(l.correct) t.c++; else t.missed.push(l.concept || "");
  });
  const rows = Object.keys(byTopic).map(id => {
    const t = byTopic[id], s = sectionById(id);
    const missed = Array.from(new Set(t.missed.filter(Boolean)));
    return {id, title:s.title, n:t.n, c:t.c, pct:t.c / t.n, avgLv:t.lv / t.n, missed, rated:t.n >= 2};
  }).sort((a,b) => a.pct - b.pct || b.n - a.n);

  const byLevel = LEVELS.map(l => {
    const at = log.filter(x => x.level === l.n);
    return {l, n:at.length, c:at.filter(x=>x.correct).length};
  }).filter(r => r.n > 0);

  const weak = rows.filter(r => r.rated && r.pct < 0.6);
  const strong = rows.filter(r => r.rated && r.pct >= 0.8).slice().reverse();
  const thin = rows.filter(r => !r.rated && r.pct < 1);
  // Ceiling: the highest level where the learner answered more right than wrong.
  const solid = byLevel.filter(r => r.c / r.n >= 0.6).map(r => r.l.n);
  const ceiling = solid.length ? Math.max(...solid) : 1;

  saveHistory({at:Date.now(), correct, peak:R.peak, ceiling, mins});
  const hist = loadHistory();

  const meterColor = p => p >= 0.8 ? "var(--ok)" : p < 0.6 ? "var(--bad)" : "var(--hv)";

  app.innerHTML = `
  <div class="sumhead">
    <div class="eyebrow">Round complete</div>
    <h1 style="font-size:clamp(27px,5.5vw,38px)">${correct} of 21 correct</h1>
    <p class="lede" style="font-size:16px">${verdictLine(correct, ceiling, R.peak)}</p>
  </div>

  <div class="kpis">
    <div class="card kpi"><div class="k">Score</div><div class="v">${correct}<span style="font-size:17px;color:var(--muted)">/21</span></div><div class="s">${Math.round(correct/21*100)}% correct</div></div>
    <div class="card kpi"><div class="k">Peak level</div><div class="v">L${R.peak}</div><div class="s">${esc(LEVELS[R.peak-1].name)}</div></div>
    <div class="card kpi"><div class="k">Held at</div><div class="v">L${ceiling}</div><div class="s">last level ≥60% right</div></div>
    <div class="card kpi"><div class="k">Time</div><div class="v">${mins}<span style="font-size:17px;color:var(--muted)">m</span></div><div class="s">${Math.round(mins*60/21)}s per question</div></div>
  </div>

  <div class="sec">
    <h2>Where you stand, by topic</h2>
    <div class="card" style="padding:6px 18px">
      ${rows.map(r => `
        <div class="trow">
          <div class="tname">${esc(r.title)}${!r.rated ? `` : r.pct >= 0.8 ? `<span class="tag s">strong</span>` : r.pct < 0.6 ? `<span class="tag w">weak</span>` : ``}
            <i>${r.n} question${r.n>1?"s":""}${r.rated ? "" : ", too few to rate"} · avg L${r.avgLv.toFixed(1)}${r.missed.length ? " · missed: " + esc(r.missed.slice(0,2).join(", ")) : ""}</i></div>
          <div class="meter"><i style="width:${Math.round(r.pct*100)}%;background:${meterColor(r.pct)}"></i></div>
          <div class="tscore">${r.c}/${r.n}</div>
        </div>`).join("")}
    </div>
  </div>

  <div class="sec">
    <h2>How you held up as it got harder</h2>
    <div class="card" style="padding:4px 12px"><div class="tblwrap"><table class="lvtable">
      <thead><tr><th>Level</th><th>What it asked for</th><th style="text-align:right">Asked</th><th style="text-align:right">Right</th></tr></thead>
      <tbody>${byLevel.map(r => `<tr>
        <td class="mono" style="color:var(--hv);font-weight:600">L${r.l.n}</td>
        <td>${esc(r.l.name)}</td>
        <td class="n">${r.n}</td>
        <td class="n" style="color:${r.c/r.n>=0.6?"var(--ok)":"var(--bad)"}">${r.c}</td>
      </tr>`).join("")}</tbody>
    </table></div></div>
  </div>

  <div class="sec">
    <h2>What to do before the next round</h2>
    <ol class="plan">${buildPlan(weak, strong, byLevel, ceiling, thin).map(p => `<li>${p}</li>`).join("")}</ol>
  </div>

  ${hist.length > 1 ? `<div class="sec"><h2>Your rounds so far</h2><div class="card" style="padding:6px 18px"><div class="hist">
    ${hist.slice().reverse().slice(0,10).map((h,i) => `<div class="hrow">
      <span>${i===0?"▸ ":"&nbsp;&nbsp;"}${new Date(h.at).toLocaleDateString(undefined,{day:"2-digit",month:"short"})} ${new Date(h.at).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}</span>
      <span>${h.correct}/21 · peak L${h.peak}</span></div>`).join("")}
  </div></div></div>` : ``}

  <div class="endrow">
    <button class="btn" id="again">Take another round</button>
    <button class="btn ghost" id="home">Back to start</button>
  </div>
  <footer>Every round draws fresh questions, so a repeat is a new test rather than a memory check. Your scores stay in this browser only.</footer>`;

  $("#again").onclick = () => { beginRound(); window.scrollTo(0,0); };
  $("#home").onclick = () => { renderStart(); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

function verdictLine(correct, ceiling, peak){
  if(correct >= 17) return `You held level ${ceiling} work and reached L${peak}. The ladder ran out before you did — the gaps below are narrow ones.`;
  if(correct >= 12) return `Solid through L${ceiling}. The round found the edge of your range at L${Math.min(5, ceiling+1)}, which is where the next study block belongs.`;
  if(correct >= 7)  return `The foundations are uneven. Fix the weak topics below before pushing for higher levels.`;
  return `Read the flagged sections before the next attempt. This round was mostly recall and comparison, so the gaps are in the base vocabulary.`;
}
function buildPlan(weak, strong, byLevel, ceiling, thin){
  const out = [];
  if(weak.length){
    out.push(`Re-read <b>${weak.slice(0,2).map(w=>esc(w.title)).join("</b> and <b>")}</b> — you scored ${weak[0].c}/${weak[0].n} there${weak[0].missed.length ? `, missing ${esc(weak[0].missed.slice(0,2).join(" and "))}` : ""}.`);
  } else {
    out.push(`No topic fell below 60%. Push the difficulty instead: aim to hold <b>L${Math.min(5, ceiling+1)} ${esc(LEVELS[Math.min(4, ceiling)].name)}</b> next round.`);
  }
  const l4 = byLevel.find(r => r.l.n >= 4);
  if(l4 && l4.c / l4.n < 0.6) out.push(`Your accuracy fell away at <b>L${l4.l.n} ${esc(l4.l.name)}</b> (${l4.c}/${l4.n}). Work the handbook's Section 12 calculations with a pen — that is what L4 questions are built from.`);
  else if(!l4) out.push(`You did not reach L4 this round. Three correct in a row is all it takes — accuracy at L2 is the bottleneck, not difficulty.`);
  if(weak.length > 2) out.push(`Leave <b>${esc(weak[2].title)}</b> for the round after. Two topics per study block beats five.`);
  if(strong.length) out.push(`Keep <b>${strong.slice(0,2).map(s=>esc(s.title)).join("</b> and <b>")}</b> warm but do not re-study ${strong.length>1?"them":"it"} — you are already at ${Math.round(strong[0].pct*100)}%.`);
  if(thin && thin.length) out.push(`<b>${esc(thin[0].title)}</b> came up only ${thin[0].n === 1 ? "once" : "twice"} and you missed it. One miss is not a verdict — retake and see whether it repeats.`);
  out.push(`Retake now while the misses are fresh. The questions will be different.`);
  return out.slice(0,5);
}

/* ---------------- history ---------------- */
function loadHistory(){
  try{ const r = localStorage.getItem(LS); return r ? JSON.parse(r) : []; }catch(e){ return []; }
}
function saveHistory(entry){
  try{
    const h = loadHistory(); h.push(entry);
    localStorage.setItem(LS, JSON.stringify(h.slice(-40)));
  }catch(e){}
}

/* ---------------- input ---------------- */
document.addEventListener("keydown", e => {
  if(!R || $("#strip").hidden) return;
  const k = e.key.toUpperCase();
  if(!R.answered && R.q && !R.loading){
    const i = "ABCD".indexOf(k) > -1 ? "ABCD".indexOf(k) : (["1","2","3","4"].indexOf(k));
    if(i > -1){ e.preventDefault(); answer(i); }
  } else if(R.answered && (k === "ENTER" || k === " ")){
    e.preventDefault(); advance();
  }
});
document.addEventListener("click", e => {
  if(e.target && e.target.id === "quit"){
    if(R && R.log.length && confirm("End the round here? You will get a summary of the " + R.log.length + " question" + (R.log.length>1?"s":"") + " answered so far.")) finish();
    else if(R && !R.log.length){ R = null; renderStart(); }
  }
});

ensureSample();
renderStart();
</script>
